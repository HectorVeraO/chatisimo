name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  NODE_VERSION: 24.14.0
  GITLEAKS_VERSION: 8.30.1
  SQLC_VERSION: 1.31.1
  # sqlc publishes no checksums file; this is the digest GitHub reports for the release asset.
  SQLC_LINUX_AMD64_SHA256: 497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          curl -sSfL -o "${RUNNER_TEMP}/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "${RUNNER_TEMP}"
          grep " ${archive}\$" checksums.txt | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
      - name: Scan full history
        run: gitleaks git --redact --verbose --exit-code 1 .

  identity:
    name: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit emails
        env:
          # A pull request checks out a synthetic merge commit; scan from the branch head instead.
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          offenders=""
          while IFS=$'\t' read -r sha author committer; do
            for email in "${author}" "${committer}"; do
              case "${email}" in
                *@users.noreply.github.com | noreply@github.com) ;;
                *) offenders="${offenders} ${sha}"; break ;;
              esac
            done
          done < <(git log --format='%h%x09%ae%x09%ce' "${TARGET_SHA}")
          if [ -n "${offenders}" ]; then
            echo "Commits whose author or committer email is not a GitHub noreply address:${offenders}"
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Install sqlc
        run: |
          set -euo pipefail
          archive="sqlc_${SQLC_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/sqlc-dev/sqlc/releases/download/v${SQLC_VERSION}/${archive}"
          cd "${RUNNER_TEMP}"
          echo "${SQLC_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/sqlc-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/sqlc-bin" sqlc
          echo "${RUNNER_TEMP}/sqlc-bin" >> "${GITHUB_PATH}"
      - name: Check generated sqlc code is current
        run: sqlc diff -f internal/giftexchange/internal/store/sqlc.yaml

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run the E2E tests against the coverage build
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.cover/e2e" "${RUNNER_TEMP}/e2e-logs"
          go test -tags e2e -count=1 -timeout 15m ./e2e/... -args             -coverdir="${GITHUB_WORKSPACE}/.cover/e2e" -logdir="${RUNNER_TEMP}/e2e-logs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cover-e2e
          path: .cover/e2e
          retention-days: 1
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 7
          if-no-files-found: warn

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Scan for reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  playwright:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the stack environment
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          master_key="$(openssl rand -base64 32)"
          echo "::add-mask::${password}"
          echo "::add-mask::${master_key}"
          {
            echo "POSTGRES_USER=chatisimo"
            echo "POSTGRES_PASSWORD=${password}"
            echo "POSTGRES_DB=chatisimo"
            echo "MASTER_KEY=${master_key}"
            echo "CHATISIMO_ENV=local"
          } > .env
      - name: Start the E2E stack
        run: docker compose --env-file .env -f .deploy/local/docker-compose.yaml --profile e2e up -d --build --wait
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --prefix playwright
      - run: npx --prefix playwright playwright install --with-deps chromium
      - name: Run the browser suite
        run: npm --prefix playwright test
      - name: Save the stack log
        if: always()
        run: docker compose --env-file .env -f .deploy/local/docker-compose.yaml --profile e2e logs --no-color > "${RUNNER_TEMP}/compose.log"
      - name: Stop the bot to flush its coverage
        if: always()
        run: docker compose --env-file .env -f .deploy/local/docker-compose.yaml --profile e2e stop chatisimo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            playwright/playwright-report
            playwright/test-results
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-stack
          path: |
            ${{ runner.temp }}/compose.log
            .cover/playwright
          retention-days: 7
          if-no-files-found: warn
      - name: Remove the E2E stack
        if: always()
        run: docker compose --env-file .env -f .deploy/local/docker-compose.yaml --profile e2e down
