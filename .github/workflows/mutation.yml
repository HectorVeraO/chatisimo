name: mutation

on:
  schedule:
    # 04:00 in Santiago (UTC-3)
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gremlins:
    name: gremlins
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run mutation testing on the domain module
        run: |
          set -euo pipefail
          go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash \
            --output "${RUNNER_TEMP}/gremlins.json" \
            ./internal/giftexchange
      - name: Publish the report as the job summary
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/gremlins.json"
          if [ ! -s "${report}" ]; then
            echo "gremlins produced no report; see the job log." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if ! jq -e '[.mutants_killed, .mutants_lived, .mutants_not_covered, .test_efficacy, .mutations_coverage] | all(type == "number")' "${report}" > /dev/null; then
            echo "gremlins report lacks the expected fields; see the job log and the artifact." >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          {
            echo "## Mutation testing: internal/giftexchange"
            echo
            echo "| Killed | Lived | Not covered | Test efficacy | Mutator coverage |"
            echo "|---:|---:|---:|---:|---:|"
            jq -r '"| \(.mutants_killed) | \(.mutants_lived) | \(.mutants_not_covered) | \(.test_efficacy * 100 | round / 100)% | \(.mutations_coverage * 100 | round / 100)% |"' "${report}"
            lived="$(jq -r '[.files[]? | .file_name as $f | .mutations[]? | select(.status == "LIVED") | "- `\($f):\(.line):\(.column)` \(.type)"] | .[]' "${report}")"
            if [ -n "${lived}" ]; then
              echo
              echo "### Lived mutants"
              echo
              echo "${lived}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: gremlins-report
          path: ${{ runner.temp }}/gremlins.json
          if-no-files-found: ignore
          retention-days: 14
