<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fake Discord</title>
  <link rel="stylesheet" href="/web/app.css">
  <script type="module" src="/web/app.js"></script>
</head>
<body>
  <header class="topbar">
    <label class="topbar-item">
      <span>User</span>
      <select id="user-switcher" data-testid="user-switcher"></select>
    </label>
    <label class="topbar-item">
      <span>Locale</span>
      <select id="user-locale" data-testid="user-locale">
        <option value="en-US">en-US</option>
        <option value="es-419">es-419</option>
        <option value="es-ES">es-ES</option>
      </select>
    </label>
    <form id="new-user-form" class="topbar-item">
      <input type="text" id="new-user-name" data-testid="new-user-name" aria-label="New user name" placeholder="New user" autocomplete="off">
      <button type="submit" data-testid="new-user-submit">Add user</button>
    </form>
    <div class="topbar-item bot">
      <span>Bot</span>
      <strong id="bot-status" data-testid="bot-status">absent</strong>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Servers and direct messages">
      <h2>Servers</h2>
      <ul id="server-list" class="server-list" data-testid="server-list"></ul>

      <form id="new-server-form" class="side-form">
        <input type="text" id="new-server-name" data-testid="new-server-name" aria-label="New server name" placeholder="New server" autocomplete="off">
        <button type="submit" data-testid="new-server-submit">Add server</button>
      </form>

      <form id="member-form" class="side-form">
        <div class="side-caption">Members of <strong id="member-server">no server</strong></div>
        <label class="side-caption" for="server-locale">Server locale</label>
        <select id="server-locale" data-testid="server-locale">
          <option value="en-US">en-US</option>
          <option value="es-419">es-419</option>
          <option value="es-ES">es-ES</option>
        </select>
        <ul id="member-list" class="member-list"></ul>
        <select id="member-select" data-testid="member-select" aria-label="User to add"></select>
        <button type="submit" data-testid="member-add">Add member</button>
      </form>

      <h2>Direct messages</h2>
      <div class="dm-row">
        <button type="button" id="dm-link" class="dm-link" data-testid="dm-link">Chatisimo</button>
        <span id="dm-badge"></span>
      </div>
    </nav>

    <main class="main">
      <div id="channel-header" class="channel-header" data-testid="channel-header"></div>
      <div id="app-error" class="app-error" role="alert" hidden></div>
      <div id="message-list" class="message-list" data-testid="message-list"></div>

      <form id="composer" class="composer" autocomplete="off">
        <div id="slash-suggestions" class="suggestions" data-testid="slash-suggestions" role="listbox" hidden></div>
        <div id="slash-options" class="slash-options"></div>
        <div id="slash-error" class="form-error" data-testid="slash-error" role="alert" hidden></div>
        <div class="composer-line">
          <input type="text" id="slash-input" data-testid="slash-input" aria-label="Slash command" placeholder="Type / to run a command" autocomplete="off">
          <button type="submit" data-testid="slash-submit">Send</button>
        </div>
      </form>
    </main>
  </div>

  <div id="modal-root"></div>
</body>
</html>
