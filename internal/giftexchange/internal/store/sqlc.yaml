version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: db
        out: db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_interface: false
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type:
              import: uuid
              type: UUID
