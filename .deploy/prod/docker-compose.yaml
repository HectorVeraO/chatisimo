# Production stack on the GCP VM. release.sh installs the stack files in /opt/chatisimo; the
# secrets live in /config/chatisimo/prod (mode 700, written by hand once) and reach the
# containers only through the env_file paths below. Run it through compose.sh.
name: chatisimo

services:
  chatisimo-postgres:
    container_name: chatisimo-postgres
    image: postgres:18.6-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_connections=20"]
    env_file:
      - /config/chatisimo/prod/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      default:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  chatisimo-bot:
    container_name: chatisimo-bot
    image: ${CHATISIMO_IMAGE:?set CHATISIMO_IMAGE in release.env}
    restart: unless-stopped
    depends_on:
      chatisimo-postgres:
        condition: service_healthy
    env_file:
      - /config/chatisimo/prod/chatisimo.env
    environment:
      CHATISIMO_ENV: production
    command: ["run"]
    stop_grace_period: 40s

volumes:
  postgres-data:
